trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines.yml

parameters:
  - name: azureServiceConnection
    displayName: Azure service connection
    type: string
    default: sc-sampleapp-dev

variables:
  subscriptionId: "87f9d502-d8bd-4f58-be1a-32a365b439c9"
  resourceGroupName: rg-sampleapp-dev-eastus
  templateFile: "$(Build.SourcesDirectory)/infra/main.bicep"
  parametersFile: "$(Build.SourcesDirectory)/infra/main.dev.bicepparam"

stages:
  - stage: Validate
    displayName: Validate Bicep
    jobs:
      - job: ValidateBicep
        displayName: Validate Bicep configuration
        pool:
          name: SelfHosted

        steps:
          - checkout: self

          - task: BicepDeploy@0
            displayName: Validate Bicep deployment
            inputs:
              azureResourceManagerConnection: ${{ parameters.azureServiceConnection }}
              type: deployment
              operation: validate
              scope: resourceGroup
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroupName)
              name: ValidateSampleApp
              templateFile: $(templateFile)
              parametersFile: $(parametersFile)

  - stage: WhatIf
    displayName: Preview Changes
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PreviewBicep
        displayName: Run Bicep What-If
        pool:
          name: SelfHosted

        steps:
          - checkout: self

          - task: BicepDeploy@0
            displayName: Preview Azure changes
            inputs:
              azureResourceManagerConnection: ${{ parameters.azureServiceConnection }}
              type: deployment
              operation: whatIf
              scope: resourceGroup
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroupName)
              name: PreviewSampleApp
              templateFile: $(templateFile)
              parametersFile: $(parametersFile)

  - stage: Deploy
    displayName: Deploy Infrastructure
    dependsOn: WhatIf

    # Deploy only from main, not from pull request validation.
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )

    jobs:
      - deployment: DeployBicep
        displayName: Deploy Bicep configuration
        pool:
          name: SelfHosted

        environment: sampleapp-development

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: BicepDeploy@0
                  displayName: Deploy Azure resources
                  inputs:
                    azureResourceManagerConnection: ${{ parameters.azureServiceConnection }}
                    type: deployment
                    operation: create
                    scope: resourceGroup
                    subscriptionId: $(subscriptionId)
                    resourceGroupName: $(resourceGroupName)
                    name: "SampleApp-$(Build.BuildId)"
                    templateFile: $(templateFile)
                    parametersFile: $(parametersFile)